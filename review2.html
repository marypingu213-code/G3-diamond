<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複習二：綜合練習 - 國語樂園</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fdf5e6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; /* 充滿整個螢幕高度 */
            box-sizing: border-box;
            overflow: hidden; /* 防止滾動，保持單頁簡報感 */
        }
        
        /* 頂部導航與進度條 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .back-btn {
            text-decoration: none;
            background-color: #00897b;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 24px;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background-color: #00695c;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        .progress-text {
            font-size: 28px;
            font-weight: bold;
            color: #4a5568;
            background: #e2e8f0;
            padding: 10px 30px;
            border-radius: 50px;
        }

        /* 題目顯示區域 (充滿畫面核心) */
        .slide-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        
        .question-slide {
            display: none; /* 預設隱藏所有題目 */
            width: 100%;
            max-width: 1400px;
            height: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-left: 15px solid #fbc531;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-in-out;
            text-align: center;
        }
        .question-slide.active {
            display: flex; /* 只顯示有 active class 的題目 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .section-badge {
            background-color: #4a5568;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 閱讀題的樣式 */
        .sentence-text {
            font-size: clamp(40px, 5vw, 65px); /* 超巨大字體 */
            color: #1a202c;
            line-height: 1.8;
            letter-spacing: 5px;
            font-weight: bold;
        }
        u { text-decoration-color: #e53e3e; text-decoration-thickness: 6px; text-underline-offset: 12px; }

        /* 底部上一題/下一題導航 */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            padding: 30px 5%;
            background: #fff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .nav-btn {
            font-family: inherit;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 20px;
            border: none;
            background-color: #4299e1;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 12px rgba(66, 153, 225, 0.3);
        }
        .nav-btn:hover:not(:disabled) {
            background-color: #3182ce;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(66, 153, 225, 0.4);
        }
        .nav-btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .nav-btn.finish-btn {
            background-color: #4cd137;
            box-shadow: 0 6px 12px rgba(76, 209, 55, 0.3);
        }
        .nav-btn.finish-btn:hover {
            background-color: #44bd32;
            box-shadow: 0 10px 20px rgba(76, 209, 55, 0.4);
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅️ 回大廳</a>
        <div class="progress-text" id="progressIndicator">第 1 / 8 題</div>
    </div>

    <div class="slide-container" id="slideContainer">
        
        <div class="question-slide active">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text"><u>巴黎鐵搭</u>是<u>法國</u>知名的觀光景點。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text">我想去看看<u>臺南</u>有名的<u>鹽水蜂炮</u>。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找</div>
            <div class="sentence-text">美麗的珊瑚是海洋的珍寶，需要我們好好去愛護。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找</div>
            <div class="sentence-text">屋簷底下經常會有燕子飛來築巢。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text">各式各樣的風箏飄福在空中的場面，真是壯觀啊！</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text">這間抗空公司正在招募有經驗的機師。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text">出海的傳隻總有返鄉靠岸的一天。</div>
        </div>

        <div class="question-slide">
            <div class="section-badge">✨ 讀一讀、找一找 (挑出錯字)</div>
            <div class="sentence-text">時間對媽媽師展魔法，讓她多了許多白髮。</div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)" disabled>◀ 上一題</button>
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">下一題 ▶</button>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.question-slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressIndicator = document.getElementById('progressIndicator');

        function updateUI() {
            // 切換 active class
            slides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            // 更新進度文字
            progressIndicator.innerText = `第 ${currentSlide + 1} / ${slides.length} 題`;

            // 控制按鈕狀態
            prevBtn.disabled = currentSlide === 0;
            
            if (currentSlide === slides.length - 1) {
                nextBtn.innerText = "🎉 恭喜完成！回大廳";
                nextBtn.classList.add('finish-btn');
            } else {
                nextBtn.innerText = "下一題 ▶";
                nextBtn.classList.remove('finish-btn');
            }
        }

        function changeSlide(direction) {
            // 如果是在最後一題按「完成」
            if (direction === 1 && currentSlide === slides.length - 1) {
                window.location.href = 'index.html'; // 導回首頁
                return;
            }

            currentSlide += direction;
            updateUI();
        }
    </script>
</body>
</html>
