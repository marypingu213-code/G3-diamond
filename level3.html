<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>第三關：語詞填空大挑戰</title>
    <script src="data.js"></script>
    <style>
        :root {
            --font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            --primary-color: #2196F3;
            --correct-color: #4CAF50;
            --wrong-color: #F44336;
            --active-color: #ff9800;
        }

        /* 滿版設定：鎖定螢幕，絕對禁止捲軸與滑動 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f0f4c3;
            font-family: var(--font-family);
            overflow: hidden; 
            touch-action: none; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 標題區：固定高度 */
        .header-area {
            width: 100%;
            height: 9vh; 
            min-height: 65px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e6ee9c; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header-btns { display: flex; gap: 15px; align-items: center; }

        .nav-btn {
            background-color: #fff;
            color: #558b2f;
            text-decoration: none;
            font-size: clamp(16px, 1.5vw, 24px);
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid #cddc39;
            user-select: none;
        }

        /* 難度切換按鈕區 */
        .mode-btns {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.6);
            padding: 4px;
            border-radius: 50px;
            border: 2px solid #cddc39;
        }

        .mode-btn {
            font-size: clamp(16px, 1.4vw, 24px);
            font-weight: bold;
            padding: 6px 20px;
            border: none;
            background: transparent;
            color: #558b2f;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .mode-btn.active {
            background: #689f38;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .title-box { text-align: center; color: #558b2f; user-select: none; display: flex; align-items: center; gap: 20px;}
        .title-box h1 { margin: 0; font-size: clamp(22px, 2.2vw, 36px); }
        .title-box p { margin: 0; font-size: clamp(18px, 1.6vw, 28px); font-weight: bold; }

        #btn-restart {
            padding: 8px 20px;
            font-size: clamp(16px, 1.5vw, 24px);
            background: #689f38;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
        }

        /* 遊戲主畫面：分為上下兩塊 */
        .game-screen {
            width: 100vw; 
            height: 91vh; 
            padding: 1.5vw; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1.5vw;
            background: white;
            border-radius: 30px 30px 0 0;
            overflow: hidden;
        }

        /* 上方：語詞銀行區 */
        .word-bank-container {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #f9fbe7;
            border-radius: 20px;
            border: 3px dashed #cddc39;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-shrink: 0; 
        }

        .word-btn {
            font-size: clamp(22px, 2.4vw, 38px); 
            padding: 8px 18px;
            cursor: pointer;
            border: 4px solid #cddc39;
            border-radius: 15px;
            background: white;
            color: #33691e;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            user-select: none;
            -webkit-user-drag: none;
        }

        .word-btn.selected {
            background-color: var(--active-color);
            color: white;
            border-color: #e65100;
            transform: scale(1.08);
            box-shadow: 0 6px 12px rgba(230, 81, 0, 0.3);
        }

        .word-btn.used {
            opacity: 0;
            pointer-events: none;
        }

        /* 下方：題目網格區 */
        .questions-container {
            width: 100%;
            flex-grow: 1; 
            display: grid;
            /* 雙欄排列，確保 9 題不用滑動也能完美收納 */
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 30px;
            align-content: space-evenly; 
            overflow: hidden;
        }

        .question-item {
            font-size: clamp(18px, 2.6vh, 40px); 
            color: #1b5e20;
            font-weight: bold;
            line-height: 1.4;
            user-select: none;
            background: #f1f8e9;
            padding: 10px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
        }

        .q-num {
            color: #689f38;
            margin-right: 10px;
            flex-shrink: 0;
        }

        /* 點擊空格區域 */
        .blank-space {
            display: inline-block;
            min-width: 4em;
            height: 1.2em;
            line-height: 1.2em;
            border: 3px dashed #7cb342;
            background-color: #fff;
            margin: 0 10px;
            color: #ff5722;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            vertical-align: middle;
        }

        .blank-space.clickable:hover {
            background-color: #fff9c4;
            border-color: #fbc02d;
        }

        .blank-space.filled {
            border: 3px solid var(--correct-color);
            background-color: #e8f5e9;
            color: var(--correct-color);
            cursor: default;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: var(--wrong-color) !important;
            background-color: #ffebee !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        @media (max-width: 900px) {
            .questions-container {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            .question-item {
                font-size: clamp(16px, 2.2vh, 30px);
                padding: 5px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <div class="header-btns">
            <a href="index.html" class="nav-btn">🏠 回大廳</a>
            <a href="#" id="back-btn" class="nav-btn">🔙 回選單</a>
            <div class="mode-btns" id="mode-selector">
                <button id="btn-basic" class="mode-btn active" onclick="switchMode('basic')">🟩 基礎版</button>
                <button id="btn-advanced" class="mode-btn" onclick="switchMode('advanced')">🚀 進階版</button>
            </div>
        </div>
        
        <div class="title-box">
            <h1 id="lesson-title">載入中...</h1>
            <p>⏱️ <span id="timer">0</span> 秒</p>
        </div>

        <button id="btn-restart" onclick="initGame()">🔄 重新開始</button>
    </div>

    <div class="game-screen">
        <div class="word-bank-container" id="word-bank"></div>
        
        <div class="questions-container" id="questions-grid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id') || "1"; 
        document.getElementById('back-btn').href = `lesson.html?id=${lessonId}`;
        
        let allRawQuestions = []; // 原始全部題目
        let questions = [];       // 當前篩選後的題目 (最多 9-10 題)
        let wordBank = [];        // 當前關卡的語詞
        let currentMode = 'basic'; // 預設基礎版
        let selectedWordBtn = null; 
        let filledCount = 0;
        let seconds = 0;
        let timer;

        const timerLabel = document.getElementById('timer');
        const wordBankDiv = document.getElementById('word-bank');
        const questionsGrid = document.getElementById('questions-grid');
        const modeSelector = document.getElementById('mode-selector');

        if (typeof allLessonsData !== 'undefined' && allLessonsData[lessonId]) {
            document.getElementById('lesson-title').innerText = "第三關：" + allLessonsData[lessonId].title;
            allRawQuestions = allLessonsData[lessonId].level3 || [];
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            
            // 切換按鈕高亮
            document.getElementById('btn-basic').classList.toggle('active', mode === 'basic');
            document.getElementById('btn-advanced').classList.toggle('active', mode === 'advanced');
            
            initGame();
        }

        function initGame() {
            seconds = 0;
            filledCount = 0;
            selectedWordBtn = null;
            timerLabel.textContent = '0';
            clearInterval(timer);
            startTimer();

            wordBankDiv.innerHTML = '';
            questionsGrid.innerHTML = '';

            if (allRawQuestions.length === 0) {
                questionsGrid.innerHTML = '<h2 style="grid-column: 1/-1; text-align: center; color: #d32f2f;">資料庫 level3 尚未填寫喔！</h2>';
                modeSelector.style.display = 'none';
                return;
            }

            // 根據題數決定是否需要切換鈕 (小於等於 9 題的舊關卡直接全開並隱藏按鈕)
            if (allRawQuestions.length <= 9) {
                questions = [...allRawQuestions];
                modeSelector.style.display = 'none';
            } else {
                modeSelector.style.display = 'flex';
                // 前 9 題為基礎版，第 10 題之後為進階版
                if (currentMode === 'basic') {
                    questions = allRawQuestions.slice(0, 9);
                } else {
                    questions = allRawQuestions.slice(9);
                }
            }

            // 萃取「當前關卡」的答案生成語詞銀行，避免混雜另一關的語詞
            let allAnswers = questions.map(q => q.answer);
            wordBank = [...new Set(allAnswers)]; 

            // 1. 渲染語詞銀行 (隨機打亂順序)
            [...wordBank].sort(() => Math.random() - 0.5).forEach(word => {
                const btn = document.createElement('div');
                btn.className = 'word-btn';
                btn.textContent = word;
                
                btn.onclick = () => {
                    if (btn.classList.contains('used')) return;
                    if (selectedWordBtn) selectedWordBtn.classList.remove('selected');
                    
                    selectedWordBtn = btn;
                    btn.classList.add('selected');
                    speak(word); 
                };
                wordBankDiv.appendChild(btn);
            });

            // 2. 渲染題目區 (隨機打亂題目順序)
            let shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
            shuffledQuestions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-item';
                
                let sentenceHTML = q.text.replace(
                    "________", 
                    `<span class="blank-space clickable" data-answer="${q.answer}">  </span>`
                );

                qDiv.innerHTML = `<span class="q-num">${index + 1}.</span> <span>${sentenceHTML}</span>`;
                
                const blankSpan = qDiv.querySelector('.blank-space');
                blankSpan.onclick = () => handleBlankClick(blankSpan, q.text, q.answer);

                questionsGrid.appendChild(qDiv);
            });
        }

        function handleBlankClick(blankSpan, fullText, correctAnswer) {
            if (blankSpan.classList.contains('filled') || !selectedWordBtn) return;

            const selectedWord = selectedWordBtn.textContent;

            if (selectedWord === correctAnswer) {
                // 答對反饋
                blankSpan.textContent = selectedWord;
                blankSpan.classList.remove('clickable');
                blankSpan.classList.add('filled');
                
                selectedWordBtn.classList.remove('selected');
                selectedWordBtn.classList.add('used');
                selectedWordBtn = null;
                
                filledCount++;

                // 朗讀完整句子
                const completeSentence = fullText.replace("________", selectedWord);
                speak(completeSentence);

                if (filledCount === questions.length) {
                    clearInterval(timer);
                    setTimeout(() => { alert(`🎉 太棒了！花了 ${seconds} 秒完成挑戰！`); }, 800);
                }
            } else {
                // 答錯抖動
                blankSpan.classList.add('shake');
                setTimeout(() => { blankSpan.classList.remove('shake'); }, 400);
            }
        }

        function startTimer() { 
            timer = setInterval(() => { seconds++; timerLabel.textContent = seconds; }, 1000); 
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-TW';
                utter.rate = 0.88; // 稍微放慢語速，利於特教學習環境
                window.speechSynthesis.speak(utter);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
