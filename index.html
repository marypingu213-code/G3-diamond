<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年級國語樂園首頁</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fdf5e6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 4%;
            box-sizing: border-box;
        }
        .header-area {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #4a5568;
            font-size: clamp(32px, 4vw, 50px);
            margin: 0;
            letter-spacing: 2px;
        }
        
        /* 💡 新增：期末複習關卡區塊樣式 */
        .stage-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }
        .stage-card {
            background: #fff3cd;
            border: 3px dashed #ffc107;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #856404;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stage-card:hover {
            transform: scale(1.05);
            background: #ffeeba;
            border-style: solid;
        }
        .section-title {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 3px solid #cbd5e0;
            padding-bottom: 5px;
            width: 100%;
            max-width: 1400px;
        }

        /* 原本的課文區塊樣式 */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1400px;
        }
        .lesson-card {
            background: white;
            border-radius: 15px;
            border: 4px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            user-select: none;
        }
        .lesson-card:hover, .lesson-card:active {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }
        .lesson-num { font-size: clamp(24px, 2vw, 30px); font-weight: bold; color: #00897b; margin-bottom: 12px; }
        .lesson-name { font-size: clamp(16px, 1.5vw, 20px); color: #718096; }
        .lesson-card:nth-child(4n+1) { border-color: #fbc531; }
        .lesson-card:nth-child(4n+2) { border-color: #4cd137; }
        .lesson-card:nth-child(4n+3) { border-color: #00a8ff; }
        .lesson-card:nth-child(4n+4) { border-color: #9c88ff; }

        @media (max-width: 1024px) { .cards-container, .stage-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .cards-container, .stage-container { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

</html>
