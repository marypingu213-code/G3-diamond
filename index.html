<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年級國語樂園首頁</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fdf5e6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 4%;
            box-sizing: border-box;
        }
        .header-area {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #4a5568;
            font-size: clamp(32px, 4vw, 50px);
            margin: 0;
            letter-spacing: 2px;
        }
        
        .stage-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }
        .stage-card {
            background: #fff3cd;
            border: 3px dashed #ffc107;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #856404;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stage-card:hover {
            transform: scale(1.05);
            background: #ffeeba;
            border-style: solid;
        }
        .section-title {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 3px solid #cbd5e0;
            padding-bottom: 5px;
            width: 100%;
            max-width: 1400px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1400px;
        }
        .lesson-card {
            background: white;
            border-radius: 15px;
            border: 4px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            user-select: none;
        }
        .lesson-card:hover, .lesson-card:active {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }
        .lesson-num { font-size: clamp(24px, 2vw, 30px); font-weight: bold; color: #00897b; margin-bottom: 12px; }
        .lesson-name { font-size: clamp(16px, 1.5vw, 20px); color: #718096; }
        .lesson-card:nth-child(4n+1) { border-color: #fbc531; }
        .lesson-card:nth-child(4n+2) { border-color: #4cd137; }
        .lesson-card:nth-child(4n+3) { border-color: #00a8ff; }
        .lesson-card:nth-child(4n+4) { border-color: #9c88ff; }

        @media (max-width: 1024px) { .cards-container, .stage-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .cards-container, .stage-container { grid-template-columns: repeat(2, 1fr); } }

        /* 💡 新增：QR Code 懸浮按鈕與彈出視窗樣式 */
        .qr-float-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #00897b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qr-float-btn:hover {
            background-color: #00695c;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .qr-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px); /* 背景微微模糊效果 */
        }
        .qr-modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 32px;
            cursor: pointer;
            color: #a0aec0;
            background: none;
            border: none;
            transition: 0.2s;
        }
        .close-btn:hover { color: #e53e3e; transform: scale(1.1); }
        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        #qrcode img {
            border-radius: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="header-area">
        <h1>🎡 國語樂園 🎡</h1>
    </div>

    <div class="section-title">🏆 期末複習大挑戰</div>
    <div class="stage-container">
        <a href="final-stage1.html" class="stage-card">⚔️ 第一關：詞語試煉</a>
        <a href="final-stage2.html" class="stage-card">🛡️ 第二關：字詞迷宮<br><span style="font-size:14px">(建置中)</span></a>
        <a href="final-stage3.html" class="stage-card">🧙 第三關：選擇大挑戰<br><span style="font-size:14px">(建置中)</span></a>
        <a href="final-stage4.html" class="stage-card">👑 第四關：終極魔王<br><span style="font-size:14px">(建置中)</span></a>
    </div>

    <div class="section-title">📚 課文預習 / 複習</div>
    <div class="cards-container">
        <a href="lesson.html?id=1" class="lesson-card"><div class="lesson-num">第一課</div><div class="lesson-name">最美的模樣</div></a>
        <a href="lesson.html?id=2" class="lesson-card"><div class="lesson-num">第二課</div><div class="lesson-name">玩玩具</div></a>
        <a href="lesson.html?id=3" class="lesson-card"><div class="lesson-num">第三課</div><div class="lesson-name">愛玉的變身術</div></a>
        <a href="lesson.html?id=4" class="lesson-card"><div class="lesson-num">第四課</div><div class="lesson-name">楊修猜字</div></a>
        <a href="lesson.html?id=5" class="lesson-card"><div class="lesson-num">第五課</div><div class="lesson-name">唱反調</div></a>
        <a href="lesson.html?id=6" class="lesson-card"><div class="lesson-num">第六課</div><div class="lesson-name">一飛沖天</div></a>
        <a href="lesson.html?id=7" class="lesson-card"><div class="lesson-num">第七課</div><div class="lesson-name">井仔腳鹽田</div></a>
        <a href="lesson.html?id=8" class="lesson-card"><div class="lesson-num">第八課</div><div class="lesson-name">和魚一起游泳</div></a>
        <a href="lesson.html?id=9" class="lesson-card"><div class="lesson-num">第九課</div><div class="lesson-name">三峽老街樂藍染</div></a>
        <a href="lesson.html?id=10" class="lesson-card"><div class="lesson-num">第十課</div><div class="lesson-name">地球的眼淚</div></a>
        <a href="lesson.html?id=11" class="lesson-card"><div class="lesson-num">第十一課</div><div class="lesson-name">枯木是大飯店</div></a>
        <a href="lesson.html?id=12" class="lesson-card"><div class="lesson-num">第十二課</div><div class="lesson-name">騎樓</div></a>
    </div>

    <button class="qr-float-btn" onclick="openQrModal()">📱 掃描進入</button>

    <div class="qr-modal" id="qrModal">
        <div class="qr-modal-content">
            <button class="close-btn" onclick="closeQrModal()">&times;</button>
            <h2 style="margin-top: 0; color: #2d3748; font-size: 28px;">🎡 國語樂園</h2>
            <div id="qrcode"></div>
            <p style="color: #718096; margin-bottom: 0; margin-top: 15px; font-weight: bold;">請使用平板或手機掃描條碼</p>
        </div>
    </div>

    <script>
        let qrcode = null;

        function openQrModal() {
            document.getElementById('qrModal').style.display = 'flex';
            
            // 只有在第一次打開時才生成 QR Code，自動抓取當前網頁網址
            if (!qrcode) {
                qrcode = new QRCode(document.getElementById("qrcode"), {
                    text: window.location.href, // 自動抓取目前的網址
                    width: 250,
                    height: 250,
                    colorDark : "#2d3748",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        }

        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // 點擊視窗外部也能自動關閉
        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target === modal) {
                closeQrModal();
            }
        }
    </script>
</body>
</html>
