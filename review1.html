<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複習一：綜合練習 - 國語樂園</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #fdf5e6;
            margin: 0;
            padding: 40px 4%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-area {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #4a5568;
            font-size: clamp(28px, 4vw, 40px);
            margin: 0;
            letter-spacing: 2px;
        }
        .back-btn {
            position: absolute;
            left: 0;
            text-decoration: none;
            background-color: #00897b;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background-color: #00695c;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
        }
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            border-left: 8px solid #fbc531;
        }
        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .question-num {
            font-size: 22px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .question-num::before {
            content: "✏️";
        }
        .question-image {
            width: 100%;
            text-align: center;
            padding: 15px 0;
        }
        .question-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            /* 避免白色背景的字圖融入背景，加上極淡的陰影 */
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); 
        }

        @media (max-width: 768px) {
            .header-area {
                flex-direction: column;
                gap: 20px;
            }
            .back-btn {
                position: static;
            }
            .question-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <a href="index.html" class="back-btn">⬅️ 回首頁</a>
        <h1>📝 複習一：綜合練習</h1>
